<body data-screen="0" data-theme="paper">
  <div class="world" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="spot"></div>
    <div class="grain"></div>
  </div>

  <a class="skip" href="#stage">Skip to the experience</a>

  <header class="chrome">
    <a class="brand" href="#/0" id="brand">Does AI understand?</a>
    <div class="know" id="know" hidden>
      <button class="know-btn" id="know-btn" type="button" aria-expanded="false" aria-controls="know-panel">
        <span class="know-dot" aria-hidden="true"></span>What you now know
      </button>
      <div class="know-panel" id="know-panel" hidden>
        <h2>What you now know</h2>
        <ul id="know-list"></ul>
      </div>
      <div class="know-toast" id="know-toast" aria-hidden="true"></div>
    </div>
  </header>

  <main id="stage" tabindex="-1">
    <!-- Rendered here so the first paint is the title. js/screens/s00.js builds the same markup on "Start over". -->
    <section class="screen" id="arrival">
      <div class="col">
        <h1 class="hero"><span class="w" style="--i:0">Does</span> <span class="w" style="--i:1">AI</span> <span class="w" style="--i:2">understand?</span></h1>
        <p class="sub intro-sub">Let’s find out.</p>
        <svg class="signal" viewBox="0 0 360 28" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="sig" x1="0" x2="1"><stop offset="0" stop-color="#C4703F"/><stop offset=".5" stop-color="#5E8B4E"/><stop offset="1" stop-color="#3F6E8C"/></linearGradient>
          </defs>
          <path id="sigpath" class="signal-path" pathLength="1" d="M2 14 C 40 -2, 80 30, 120 14 S 200 -2, 240 14 S 320 30, 358 14" fill="none" stroke="url(#sig)" stroke-width="2" stroke-linecap="round"/>
          <circle r="3.2" fill="#5E8B4E" class="signal-dot"><animateMotion dur="5s" repeatCount="indefinite" begin="2.4s"><mpath href="#sigpath"/></animateMotion></circle>
        </svg>
        <button class="btn primary intro-btn" id="start" type="button"><span class="btn-label">Start · 5 minutes</span><span class="btn-arrow" aria-hidden="true">→</span></button>
      </div>
    </section>
  </main>

  <footer class="chrome-foot">
    <button class="restart" id="restart" type="button">Start over</button>
    <span class="speed" aria-hidden="true">Tap empty space or press space to go faster</span>
  </footer>
  <div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <noscript><p class="noscript">This is an interactive story about how AI language models work, and it needs JavaScript. The short version: a model turns words into numbers, transforms those numbers through many layers of attention and arithmetic, and predicts the next word. Whether that amounts to understanding is still an open question.</p></noscript>
  <script type="module" src="js/main.js"></script>
